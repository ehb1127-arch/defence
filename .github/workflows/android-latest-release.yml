name: Android Latest Release

on:
  workflow_dispatch:
  push:
    branches:
      - claude/godot-coop-defense-game-nbvf64

concurrency:
  group: android-latest-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --version
          godot --headless --verbose --path . --export-debug "Android" build/android/SquareDefense.apk
          test -s build/android/SquareDefense.apk

      - name: Remove previous releases
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            for (const release of releases) {
              core.info(`Deleting release ${release.name || release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id
              });
            }
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: "tags/latest"
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }

      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest Android Build
          body: |
            Latest automated Android debug build.
            Source commit: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: build/android/SquareDefense.apk
